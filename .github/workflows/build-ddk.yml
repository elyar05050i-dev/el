name: Build DDK KernelSU Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-lkm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: [
          android14-6.1,
          android15-6.6,
          android16-6.12,
          android17-6.18
        ]
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Debug paths
        run: |
          echo "PWD=$PWD"
          echo "KDIR=$KDIR"
          ls -la kernel/
          ls -la "$KDIR"/

      - name: Build susfs_guard_lkm.ko
        run: |
          set -eux
          make -k -C "$KDIR" M="$PWD/kernel" ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules
          test -f "$PWD/kernel/susfs_guard_lkm.ko"
          cp "$PWD/kernel/susfs_guard_lkm.ko" "$PWD/kernel/susfs_guard_lkm-${{ matrix.kmi }}.ko"

      - name: Upload ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: susfs_guard_lkm-${{ matrix.kmi }}-arm64
          path: kernel/susfs_guard_lkm-${{ matrix.kmi }}.ko

  module-zip:
    needs: build-lkm
    if: github.repository != 'dreamcolor123/susfs4skp-lkm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download all ko artifacts
        uses: actions/download-artifact@v4
        with:
          path: ko-artifacts
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install loader toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Build arm64 loader
        run: |
          mkdir -p bin
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
            -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
            -o bin/susfs_insmod tools/susfs_insmod.c

      - name: Pack flashable zip
        run: |
          python tools/pack_module.py \
            --ko-dir ko-artifacts \
            --insmod bin/susfs_insmod \
            --tag 0.3.11 \
            --out 0.3.11-6.1-6.6-6.12-6.18-SUSFS-Guard-arm64.zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: susfs_guard_lkm-module-arm64
          path: 0.3.11-6.1-6.6-6.12-6.18-SUSFS-Guard-arm64.zip